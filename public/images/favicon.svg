<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Tło kontenera (ciemny grafit / granat – wysoki kontrast na jasnych i ciemnych kartach Safari/Chrome) -->
    <linearGradient id="zaniskoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1c"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#14213d"/>
    </linearGradient>

    <!-- Precyzyjna ramka zewnętrzna -->
    <linearGradient id="zaniskoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Górne ramię Z (aerodynamiczny błękit) -->
    <linearGradient id="zTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Przekątna Z (gradient audytowy z błękitu do szmaragdu) -->
    <linearGradient id="zDiagGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Dolne ramię Z (solidny szmaragd) -->
    <linearGradient id="zBottomGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Blask tarczy -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @media (prefers-color-scheme: light) {
      .squircle-bg {
        filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
      }
    }
  </style>

  <!-- Zaokrąglona baza ikony (Squircle 512x512) zapewniająca czytelność na dowolnym tle przeglądarki -->
  <rect class="squircle-bg" x="18" y="18" width="476" height="476" rx="112" ry="112" 
        fill="url(#zaniskoBg)" 
        stroke="url(#zaniskoBorder)" 
        stroke-width="16"/>

  <!-- Tło wewnętrzne z poświatą techniczną -->
  <rect x="28" y="28" width="456" height="456" rx="102" ry="102" 
        fill="url(#innerGlow)"/>

  <!-- Geometryczny znak 'Z' (Zanisko.pl) o podwyższonej grubości, czytelny od 16x16 do 512x512 -->
  <!-- Górne ramię -->
  <path d="M 120 134 L 392 134 L 392 198 L 248 198 L 184 198 L 120 134 Z" 
        fill="url(#zTopGrad)"/>

  <!-- Główna dynamiczna przekątna -->
  <polygon points="392,154 392,218 196,378 120,378 120,314 316,154" 
           fill="url(#zDiagGrad)"/>

  <!-- Dolne ramię -->
  <path d="M 120 314 L 256 314 L 328 314 L 392 378 L 120 378 Z" 
        fill="url(#zBottomGrad)"/>

  <!-- Dioda weryfikacji / punkt celowniczy audytora (biało-cyjanowy punkt w szczycie Z) -->
  <circle cx="368" cy="158" r="16" fill="#ffffff"/>
  <circle cx="368" cy="158" r="10" fill="#0284c7"/>
</svg>
